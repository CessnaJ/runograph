    <style>
      .app-launch {

        min-height: 100vh;
        min-height: 100svh;

        color: #27352c;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      }
      .app-launch img {
        width: 76px;
        height: 76px;

        font-weight: 600;
        letter-spacing: -0.9px;
      }
      .app-launch p {
        font-size: 8px;
        letter-spacing: 1.9px;
        color: #626e61;
        margin: 13px 0 0;
